# Cấu hình Netlify (docs/09 mục 4.2 và 9). Biến môi trường KHÔNG để ở đây: nhập trên Netlify
# (Site configuration → Environment variables) theo từng ngữ cảnh Production / Deploy Previews.

[build]
  # Sinh Prisma client (thư mục src/generated không commit), áp migration (tương thích ngược) rồi build.
  # DIRECT_URL là bản kết nối trực tiếp của Neon.
  command = "pnpm prisma generate && pnpm prisma migrate deploy && pnpm build"
  publish = ".next"
  # Bỏ qua build khi chỉ sửa tài liệu/CI (tiết kiệm credits, docs/09 mục 2.1). Thoát 0 = bỏ qua build.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)docs' ':(exclude)*.md' ':(exclude).github' ':(exclude)e2e'"

# Chạy Next.js trên Netlify: cài runtime chính thức của Netlify (miễn phí) và đặt thư mục phát hành `.next`.
# Không có hai dòng này thì Netlify chỉ phát hành thư mục trống và web báo 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Phiên bản Node lấy từ .nvmrc; pnpm lấy từ trường packageManager trong package.json.
  NEXT_TELEMETRY_DISABLED = "1"

# Header bảo mật đặt trong next.config.ts (docs/08 mục 5) nên không lặp lại ở đây.
