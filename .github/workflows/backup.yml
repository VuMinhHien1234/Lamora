name: Backup database

# 02:00 giờ Việt Nam = 19:00 UTC hôm trước. GitHub có thể chạy trễ vài phút.
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Cài pg_dump 17 (khớp phiên bản Postgres của Neon)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Sao lưu và mã hóa
        env:
          # DIRECT_URL của branch main trên Neon (không dùng bản pooled).
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          : "${BACKUP_DATABASE_URL:?Thiếu secret BACKUP_DATABASE_URL}"
          : "${BACKUP_PASSPHRASE:?Thiếu secret BACKUP_PASSPHRASE}"
          STAMP="$(date -u +%Y%m%d-%H%M)"
          pg_dump --format=custom --compress=9 --no-owner --no-privileges "$BACKUP_DATABASE_URL" > "lamora-${STAMP}.dump"
          test -s "lamora-${STAMP}.dump"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o "lamora-${STAMP}.dump.gpg" "lamora-${STAMP}.dump"
          rm "lamora-${STAMP}.dump"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: lamora-backup
          path: "lamora-*.dump.gpg"
          retention-days: 30
          if-no-files-found: error
