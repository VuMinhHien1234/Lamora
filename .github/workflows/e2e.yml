name: E2E

# Chạy tay (Actions → E2E → Run workflow) hoặc khi PR được gắn nhãn "e2e" (docs/09 mục 9).
on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize]
    branches: [develop, main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lamora
          POSTGRES_PASSWORD: lamora
          POSTGRES_DB: lamora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lamora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Database nằm trong job và bị xóa khi job kết thúc. Giá trị giả, không phải khóa thật.
      DATABASE_URL: postgresql://lamora:lamora@localhost:5432/lamora
      DIRECT_URL: postgresql://lamora:lamora@localhost:5432/lamora
      AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      IP_HASH_SALT: ci-only-salt-ci-only-salt-ci-only-salt
      CRON_SECRET: ci-only-cron-ci-only-cron-ci-only-cron
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ADMIN_EMAIL: e2e-admin@example.com
      ADMIN_INITIAL_PASSWORD: E2e-Admin-Password-123
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma migrate deploy
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
