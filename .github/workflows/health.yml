name: Health check

# Mỗi giờ một lần (docs/09 mục 7). Không đặt dày hơn để Neon còn tự tắt khi không có khách.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gọi /api/health (thử 2 lần cách nhau 60 giây)
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          : "${SITE_URL:?Thiếu secret SITE_URL (ví dụ https://lamoraflower.vn)}"
          check() { curl -fsS --max-time 30 "${SITE_URL%/}/api/health" | grep -q '"ok":true'; }
          if check; then echo "OK"; exit 0; fi
          sleep 60
          if check; then echo "OK (lần 2)"; exit 0; fi
          echo "Website không phản hồi 2 lần liên tiếp"
          if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
            curl -sS --max-time 15 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=⚠️ Lamora Flower: website không phản hồi /api/health 2 lần liên tiếp. Xem docs/09 mục 8.1." > /dev/null || true
          fi
          exit 1
